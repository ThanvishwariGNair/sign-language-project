<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Language Detection</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">

<style>
body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #1c2033, #2a2f4a);
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    background: #fff;
    padding: 30px;
    border-radius: 15px;
    text-align: center;
    width: 350px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
}

h1 {
    color: #333;
}

p {
    color: #777;
}

input[type="file"] {
    margin: 15px 0;
}

button {
    background: #667eea;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #5a67d8;
}

/* Image Preview */
#preview {
    width: 100%;
    margin-top: 10px;
    border-radius: 10px;
    display: none;
}

/* Loader */
#loader {
    display: none;
    margin-top: 10px;
    font-size: 14px;
    color: #555;
}

/* Result Card */
.result-card {
    margin-top: 20px;
    padding: 20px;
    border-radius: 15px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    font-size: 28px;
    font-weight: bold;
    transform: scale(0.8);
    opacity: 0;
    transition: all 0.4s ease;
}

.result-card.show {
    transform: scale(1);
    opacity: 1;
}

.footer {
    margin-top: 15px;
    font-size: 12px;
    color: #aaa;
}
</style>
</head>

<body>

<div class="container">
    <h1>🤟 Sign Detector</h1>
    <p>Upload your hand gesture</p>

    <form action="/predict" method="post" enctype="multipart/form-data" onsubmit="showLoader()">
        <input type="file" name="image" accept="image/*" onchange="previewImage(event)" required>
        <img id="preview">
        <br>
        <button type="submit">Predict</button>
    </form>

    <div id="loader">⏳ Processing...</div>

    <!-- Result -->
   {% if prediction %}
<div class="result-card show">
    Prediction: {{ prediction }}
</div>
{% endif %}

    <div class="footer">Powered by TANVI NAIR</div>
</div>

<script>
function previewImage(event) {
    const img = document.getElementById('preview');
    img.src = URL.createObjectURL(event.target.files[0]);
    img.style.display = "block";
}

function showLoader() {
    document.getElementById('loader').style.display = "block";
}
</script>

</body>
</html>
